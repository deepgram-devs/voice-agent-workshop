# Maven for this project, fetched by ./mvnw on first use (no jar: a shell script only).
# Run it as `sh ./mvnw` from java/; java/mission.sh does.
# No distributionSha256Sum, on purpose: Maven comes over HTTPS from Maven Central, and
# without unzip the wrapper fetches the -bin.tar.gz instead, which a sum for the .zip
# would fail.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
